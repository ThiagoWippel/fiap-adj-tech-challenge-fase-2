# A chave "version" foi removida da especificação do Compose e
# hoje gera aviso de obsolescência. Por isso o arquivo começa
# direto em "services".

services:

  mysql:
    image: mysql:8.4
    container_name: restaurante-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      # Porta externa diferente da interna para não conflitar com
      # uma eventual instalação local de MySQL na máquina.
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      # Volume nomeado: os dados sobrevivem ao ciclo de vida do
      # contêiner. Sem ele, o banco volta vazio a cada "down".
      - mysql-data:/var/lib/mysql
      # Scripts nesta pasta são executados pelo MySQL apenas na
      # PRIMEIRA inicialização, com o volume ainda vazio.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # O ponto mais importante deste arquivo. "depends_on" sozinho
      # garante apenas que o contêiner do banco COMEÇOU a subir, não
      # que o MySQL já aceita conexões. Sem esta verificação, a
      # aplicação sobe antes, falha ao conectar e morre - um erro
      # intermitente que só aparece na primeira execução.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - restaurante-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante-app
    restart: unless-stopped
    environment:
      # Sobrescreve o perfil declarado em application.properties.
      SPRING_PROFILES_ACTIVE: docker
      # DB_HOST é o NOME DO SERVIÇO acima, não "localhost".
      # Dentro da rede do Compose, cada contêiner tem seu próprio
      # localhost; o Docker resolve o nome do serviço para o IP certo.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # O endpoint de saúde do Actuator responde UP só quando a aplicação
      # terminou de subir e consegue falar com o banco. Assim "docker
      # compose ps" mostra "healthy" quando a API está de fato pronta para
      # receber requisições, e não apenas quando o processo Java começou.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      mysql:
        # Aguarda o healthcheck passar, não apenas o contêiner existir.
        condition: service_healthy
    networks:
      - restaurante-net

volumes:
  mysql-data:
    name: restaurante-mysql-data

networks:
  restaurante-net:
    driver: bridge
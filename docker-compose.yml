services:

  mysql:
    image: mysql:8.4
    container_name: restaurante-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      # 3307 por padrão, para não conflitar com um MySQL instalado na máquina. Só a
      # própria máquina alcança o banco; a aplicação usa a rede interna do compose.
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Executado só na primeira subida, com o volume vazio
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pela porta TCP, como a aplicação conecta. Com -h localhost o ping usa o socket e
      # responde durante a inicialização, quando o servidor temporário ainda não escuta a rede.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - restaurante-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_CHAVE: ${JWT_CHAVE}
      # O campo type dos erros aponta para a própria aplicação, na porta publicada
      RESTAURANTE_PROBLEMAS_BASEURI: http://localhost:${APP_PORT:-8080}
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      mysql:
        # Espera o MySQL aceitar conexões, não só o contêiner existir
        condition: service_healthy
    networks:
      - restaurante-net

volumes:
  mysql-data:
    name: restaurante-mysql-data

networks:
  restaurante-net:
    driver: bridge

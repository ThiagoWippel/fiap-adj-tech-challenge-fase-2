# A cada push e pull request: testes unitários, testes de integração
# (MySQL via Testcontainers), regras do ArchUnit e cortes de cobertura.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes, arquitetura e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar mvn verify
        run: ./mvnw -B verify

      - name: Publicar os relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-cobertura
          path: |
            target/site/jacoco-unitarios
            target/site/jacoco-total
          if-no-files-found: ignore

# Perfil test: a conexão vem do contêiner do Testcontainers (@ServiceConnection)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.br.com.fiap.restaurante=INFO

# Chave fixa só para os testes
restaurante.token.chave=chave-de-teste-com-pelo-menos-32-caracteres

# Estatísticas do Hibernate para contar as consultas (RES-18), sem o resumo de cada sessão no log
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

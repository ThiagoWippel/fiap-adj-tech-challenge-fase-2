spring.application.name=restaurante

# Perfil padrão; no contêiner o compose define o perfil docker
spring.profiles.active=dev

# Lê o .env da raiz do projeto (credenciais do banco no perfil dev)
spring.config.import=optional:file:.env[.properties]

# Erros do próprio Spring também no formato ProblemDetail
spring.mvc.problemdetails.enabled=true

# Base do campo "type" das respostas de erro: {base}/problemas/{identificador}
restaurante.problemas.base-uri=http://localhost:8080

# Token emitido no login. A chave vem da variável JWT_CHAVE (.env ou compose);
# sem ela, a aplicação não sobe.
restaurante.token.chave=${JWT_CHAVE:}
restaurante.token.validade=1h

# Paginação: 10 itens por padrão, no máximo 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.jackson.time-zone=America/Sao_Paulo

logging.level.br.com.fiap.restaurante=INFO

# Sem sessão aberta durante a serialização: os dados já saem prontos dos casos de uso
spring.jpa.open-in-view=false

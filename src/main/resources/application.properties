# ==========================================================
# Configuração base - vale para todos os ambientes
# ==========================================================

spring.application.name=restaurante

# Perfil ativo por padrão. No contêiner, é sobrescrito pela
# variável de ambiente SPRING_PROFILES_ACTIVE definida no compose.
spring.profiles.active=dev

# Lê o arquivo .env da raiz do projeto, quando existir, para que o
# perfil dev use as mesmas credenciais do docker-compose. Dentro do
# contêiner o arquivo não existe (fica fora da imagem) e as variáveis
# chegam pelo próprio compose; por isso a importação é opcional.
spring.config.import=optional:file:.env[.properties]

# ----------------------------------------------------------
# Tratamento de erros - RFC 7807 (ProblemDetail)
# ----------------------------------------------------------
# Faz com que as exceções lançadas pelo próprio framework
# (JSON malformado, método não suportado, parâmetro ausente)
# também sejam respondidas no formato ProblemDetail, e não
# apenas as exceções de negócio tratadas no nosso handler.
spring.mvc.problemdetails.enabled=true

# ----------------------------------------------------------
# Documentação OpenAPI / Swagger
# ----------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Ordena as operações por método HTTP em vez da ordem de declaração,
# deixando a interface previsível para quem for avaliar.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ----------------------------------------------------------
# Fuso horário
# ----------------------------------------------------------
# Fixa o fuso na serialização JSON. O contêiner MySQL opera em UTC
# por padrão; sem isso, a data gravada diverge da exibida na API.
spring.jackson.time-zone=America/Sao_Paulo

# ----------------------------------------------------------
# Log
# ----------------------------------------------------------
logging.level.br.com.fiap.restaurante=INFO

# ----------------------------------------------------------
# JPA
# ----------------------------------------------------------
# Fecha a sessão do banco ao fim da camada de serviço, em vez de
# mantê-la aberta até a resposta HTTP terminar. Como usamos DTOs
# e resolvemos tudo no serviço, não há carregamento tardio na
# serialização - e assim consultas não acontecem fora do lugar.
spring.jpa.open-in-view=false
# ==========================================================
# Perfil docker - MySQL em contêiner
# Uso: docker compose up
# ==========================================================

# ----------------------------------------------------------
# Conexão com o MySQL
# ----------------------------------------------------------
# O host é o NOME DO SERVIÇO declarado no docker-compose.yml,
# não "localhost". Dentro da rede do Compose, cada contêiner tem
# seu próprio localhost; usar localhost aqui faria a aplicação
# tentar conectar nela mesma.
#
# Os valores após ":" são apenas padrões de segurança. Em execução,
# as variáveis vêm do arquivo .env através do compose.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:restaurante_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
# validate: o Hibernate NÃO cria nem altera tabelas. Ele apenas
# confere se o esquema existente corresponde às entidades. O
# esquema é criado pelo script SQL montado no contêiner do MySQL.
# Essa separação garante que a estrutura do banco seja um artefato
# explícito e versionado, e não um efeito colateral do mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ----------------------------------------------------------
# Pool de conexões
# ----------------------------------------------------------
# Tempo de espera por uma conexão livre antes de falhar.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

logging.level.br.com.fiap.restaurante=INFO
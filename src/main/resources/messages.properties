# ==========================================================
# Mensagens dos erros gerados pelo próprio Spring
# ==========================================================
# O Spring procura o texto do campo "detail" das respostas
# ProblemDetail nas chaves problemDetail.<classe da exceção>.
# Sem elas, esses erros sairiam em inglês, diferentes de todo o
# resto da API. Os argumentos {0} e {1} são preenchidos pelo
# Spring; apóstrofos são escritos em dobro, como pede o formato
# de mensagens do Java.

problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=O corpo da requisição não pôde ser lido. Verifique se o JSON está bem formado e se cada valor tem o tipo esperado.
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=O método {0} não é suportado nesta rota.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Não existe recurso no caminho /{0}.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=O tipo de conteúdo {0} não é suportado. Envie application/json.
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Não é possível responder no formato pedido. A API responde em application/json.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=O parâmetro {0} é obrigatório.
problemDetail.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=O valor ''{1}'' não é válido para {0}.
problemDetail.org.springframework.beans.TypeMismatchException=O valor ''{1}'' não é válido para {0}.

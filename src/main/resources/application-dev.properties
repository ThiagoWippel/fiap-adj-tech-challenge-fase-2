# Perfil dev: aplicação na máquina e MySQL do compose (docker compose up -d mysql).
# Porta e credenciais vêm do .env.
spring.datasource.url=jdbc:mysql://localhost:${DB_EXTERNAL_PORT:3307}/${DB_NAME:restaurante_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema vem do script SQL; o Hibernate só confere o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

logging.level.br.com.fiap.restaurante=DEBUG

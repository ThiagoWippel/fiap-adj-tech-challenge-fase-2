# ==========================================================
# Perfil dev - aplicação na máquina, MySQL no contêiner
# Uso: docker compose up -d mysql && ./mvnw spring-boot:run
# ==========================================================

# ----------------------------------------------------------
# Conexão com o MySQL do compose
# ----------------------------------------------------------
# O mesmo banco usado no contêiner e nos testes de integração.
# Na Fase 1 este perfil usava H2 em memória; a diferença de
# comportamento entre os dois bancos (comparação de texto,
# restrições criadas pelo script) fazia o desenvolvimento aceitar
# o que a produção recusava. A porta externa e as credenciais vêm
# do arquivo .env, importado em application.properties.
spring.datasource.url=jdbc:mysql://localhost:${DB_EXTERNAL_PORT:3307}/${DB_NAME:restaurante_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
# validate também aqui: o esquema vem sempre do script SQL, e o
# Hibernate apenas confere o mapeamento contra ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

logging.level.br.com.fiap.restaurante=DEBUG

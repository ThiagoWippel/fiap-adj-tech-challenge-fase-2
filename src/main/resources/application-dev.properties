# ==========================================================
# Perfil dev - banco H2 em memória, sem Docker
# Uso: ./mvnw spring-boot:run
# ==========================================================

# ----------------------------------------------------------
# Banco em memória
# ----------------------------------------------------------
# DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto a JVM estiver
# rodando. Sem isso, o H2 descarta os dados quando a última
# conexão fecha, e a base aparece vazia entre requisições.
spring.datasource.url=jdbc:h2:mem:restaurante;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----------------------------------------------------------
# Console web do H2
# ----------------------------------------------------------
# Disponível em http://localhost:8080/h2-console
# No campo "JDBC URL" da tela de login, informar exatamente
# a mesma URL declarada acima.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
# Em desenvolvimento o Hibernate cria o esquema a partir das
# entidades. No perfil docker a estratégia é outra: o esquema
# vem de script SQL explícito e o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG